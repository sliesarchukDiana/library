services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password
      POSTGRES_DB: library_db
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: library_user
      KC_DB_PASSWORD: library_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  book-service:
    build:
      context: ./book-service
    environment:
      KAFKA_URL: kafka:29092
      GRPC_SERVER_ENABLED: "true"
      GRPC_SERVER_PORT: "9090"
    ports:
      - "8081:8081"
      - "9090:9090"
    depends_on:
      - postgres
      - keycloak
      - kafka
    restart: on-failure

  borrow-service:
    build:
      context: ./borrow-service
    environment:
      KAFKA_URL: kafka:29092
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - keycloak
      - kafka
    restart: on-failure

  web-ui:
    build:
      context: ./web-ui
    environment:
      BOOK_SERVICE_HTTP_URL: http://book-service:8081
      BOOK_SERVICE_GRPC_URL: static://book-service:9090
      BOOK_CLIENT_TYPE: grpc
    ports:
      - "8083:8083"
    depends_on:
      - keycloak
      - book-service
      - borrow-service
    restart: on-failure