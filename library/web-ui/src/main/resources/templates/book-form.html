<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New Tome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4ebd8;
            background-image: radial-gradient(circle, #fdfbf7 0%, #f4ebd8 70%, #e6d5b8 100%);
            color: #3e2723;
            font-family: 'Lora', serif;
            min-height: 100vh;
        }
        h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #4e342e;
        }
        .index-card {
            background-color: #fdfbf7;
            border: 2px solid #8d6e63;
            border-radius: 2px;
            box-shadow: 4px 6px 12px rgba(62, 39, 35, 0.2);
            padding: 2.5rem;
            position: relative;
            background-image: repeating-linear-gradient(transparent, transparent 31px, #d7ccc8 31px, #d7ccc8 32px);
            background-position: 0 40px;
        }
        /* Червона лінія зліва, типова для індексних карток */
        .index-card::before {
            content: '';
            position: absolute;
            left: 40px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #c62828;
            opacity: 0.5;
        }
        .form-label {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            background-color: #fdfbf7; /* Перекриваємо лінії фону */
            padding-right: 10px;
            font-style: italic;
        }
        .form-control {
            background-color: transparent !important;
            border: none;
            border-bottom: 2px solid #4e342e;
            border-radius: 0;
            color: #3e2723;
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            padding-left: 0;
            box-shadow: none !important;
        }
        .form-control:focus {
            border-bottom-color: #b71c1c;
        }
        .btn-book-primary {
            background-color: #5d4037; color: #fdfbf7; border: 1px solid #3e2723; font-family: 'Playfair Display', serif; letter-spacing: 1px;
        }
        .btn-book-primary:hover {
            background-color: #3e2723; color: #fff;
        }
        .cancel-link {
            color: #8d6e63;
            font-family: 'Playfair Display', serif;
            text-decoration: none;
            font-style: italic;
        }
        .cancel-link:hover {
            color: #3e2723;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="w-100" style="max-width: 550px;">
        <h2 class="text-center mb-4">Archive a New Tome</h2>

        <!-- Бібліотечна індексна картка -->
        <div class="index-card pl-5">
            <form th:action="@{/books}" th:object="${book}" method="post" style="position: relative; z-index: 2; padding-left: 30px;">

                <div class="mb-4">
                    <label for="title" class="form-label fw-bold">Title:</label>
                    <input type="text" id="title" th:field="*{title}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" />
                    <div th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"
                         class="invalid-feedback" style="background-color: #fdfbf7; display: inline-block;">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="author" class="form-label fw-bold">Author:</label>
                    <input type="text" id="author" th:field="*{author}"
                           class="form-control" />
                </div>

                <div class="mb-5">
                    <label for="availableCopies" class="form-label fw-bold">Available Copies:</label>
                    <input type="number" id="availableCopies" th:field="*{availableCopies}"
                           class="form-control w-50" min="0" required />
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a th:href="@{/}" class="cancel-link">Return to Catalog</a>
                    <button type="submit" class="btn btn-book-primary px-4 py-2">Catalog Book</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
