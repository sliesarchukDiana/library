<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Book</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 300px; padding: 8px; }
        button { padding: 10px 15px; cursor: pointer; background-color: #007bff; color: white; border: none; }
        a { margin-left: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

<h2>Add New Book</h2>

<form th:action="@{/books}" th:object="${book}" method="post">

    <div>
        <label for="title">Назва книги:</label>
        <input type="text" id="title" th:field="*{title}" />

        <div th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}"
             style="color: red; font-size: 0.9em; margin-top: 5px;">
        </div>
    </div>

    <div>
        <label for="author">Author:</label>
        <input type="text" id="author" th:field="*{author}" />
    </div>
    <div class="form-group">
        <label for="availableCopies">Available Copies:</label>
        <input type="number" id="availableCopies" th:field="*{availableCopies}" min="0" required />
    </div>
    <button type="submit">Save Book</button>
    <a th:href="@{/}">Cancel</a>
</form>

</body>
</html>
